<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RR MALL • Product</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>

<header class="main-header">
  <div class="left">
    <button class="hamburger" aria-label="Open menu">☰</button>
  </div>

  <div class="logo">
    <h2>RR MALL</h2>
    <span class="logo-tag">Premium</span>
  </div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#shop">Products</a>
    <a href="cart.html">Cart</a>
    <a id="navLoginLink" href="auth.html">Login</a>
    <span id="navUserChip" class="user-chip" style="display:none;"></span>
    <button id="navLogoutBtn" class="logout-btn" type="button" style="display:none;">Logout</button>
  </nav>

  <div class="header-right">
    <a class="back-link" href="index.html#shop">← Back</a>
    <button class="cart cart-btn" type="button" aria-label="Open cart">
      🛒 <span class="cart-count">0</span>
    </button>
  </div>
</header>

<nav class="mobile-menu" aria-label="Mobile menu">
  <div class="mobile-menu-header">
    <h3>RR MALL</h3>
    <button class="close-menu" type="button" aria-label="Close menu">✖</button>
  </div>

  <a href="index.html">Home</a>
  <a href="index.html#shop">Products</a>
  <a href="cart.html">Cart</a>

  <a id="mobLoginLink" href="auth.html">Login</a>
  <span id="mobUserChip" class="user-chip" style="display:none; margin:10px 18px 0;"></span>
  <button id="mobLogoutBtn" class="logout-btn" type="button" style="display:none; margin:10px 18px 0 18px;">Logout</button>
</nav>
<div class="menu-overlay" aria-hidden="true"></div>

<main class="pd-wrap">
  <div id="pdStatus" class="product-status" role="status" aria-live="polite"></div>

  <section class="pd-card">
    <div class="pd-left">
      <div class="pd-image-shell" id="zoomBox">
        <img id="pdImage" alt="Product image" />
        <div class="pd-zoom-hint" id="zoomHint">Hover to zoom • Tap to toggle</div>
        <div class="pd-lens" id="zoomLens" aria-hidden="true"></div>
      </div>

      <div class="pd-mini">
        <button class="pd-mini-btn active" type="button" data-view="main">Main</button>
        <button class="pd-mini-btn" type="button" data-view="alt">Alt</button>
        <button class="pd-mini-btn" type="button" data-view="detail">Detail</button>
      </div>
    </div>

    <div class="pd-right">
      <div class="pd-meta">
        <span id="pdCategory" class="pd-category"></span>
        <span id="pdRating" class="pd-rating"></span>
      </div>

      <h1 id="pdTitle" class="pd-title"></h1>
      <p id="pdDesc" class="pd-desc"></p>

      <div class="pd-price">
        <span id="pdUnitPrice" class="pd-new"></span>
        <span id="pdOldPrice" class="pd-old"></span>
      </div>

      <div class="pd-row">
        <div class="pd-variant">
          <div class="pd-label">Size: <b id="sizeValue">M</b></div>
          <div id="sizeChips" class="chip-row"></div>
        </div>

        <div class="pd-variant">
          <div class="pd-label">Color: <b id="colorValue">Gold</b></div>
          <div id="colorChips" class="chip-row"></div>
        </div>
      </div>

      <div class="pd-row pd-qty-row">
        <div class="qty">
          <button id="qtyMinus" class="qty-btn" type="button">−</button>
          <b id="qtyVal">1</b>
          <button id="qtyPlus" class="qty-btn" type="button">+</button>
          <span class="qty-hint">max 10</span>
        </div>

        <div class="pd-total">
          <div class="pd-total-label">Total</div>
          <div id="pdTotalPrice" class="pd-total-price"></div>
          <div id="pdTotalSub" class="pd-total-sub"></div>
        </div>
      </div>

      <div class="pd-actions">
        <button id="pdAddBtn" class="pd-add" type="button">Add to Cart</button>
        <button id="pdBuyBtn" class="pd-buy" type="button">Buy Now</button>
      </div>
    </div>
  </section>

  <section class="rel">
    <div class="rel-top">
      <h2>You may also like</h2>
      <a class="rel-link" href="index.html#shop">See all</a>
    </div>
    <div id="relGrid" class="product-grid rel-grid"></div>
  </section>
</main>

<!-- CART DRAWER -->
<aside class="cart-drawer" aria-label="Cart drawer" aria-hidden="true">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" type="button" aria-label="Close cart">✖</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">
    <div class="cart-summary">
      <div class="row">
        <span>Subtotal</span>
        <b id="cartSubtotal">₹ 0</b>
      </div>
      <div class="row small">
        <span>Delivery</span>
        <span id="cartDelivery">₹ 0</span>
      </div>
      <div class="row total">
        <span>Total</span>
        <b id="cartTotal">₹ 0</b>
      </div>
    </div>

    <button id="checkoutBtn" class="checkout-btn" type="button">Checkout</button>
    <button id="clearCartBtn" class="clear-btn" type="button">Clear Cart</button>
  </div>
</aside>
<div class="cart-overlay" aria-hidden="true"></div>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="scripts/product.js"></script>
<script type="module" src="scripts/auth-ui.js"></script>
</body>
</html>
