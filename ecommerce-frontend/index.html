<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RR MALL</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>

<header class="main-header">
  <div class="left">
    <button class="hamburger" aria-label="Open menu">☰</button>
  </div>

  <div class="logo">
    <h2>RR MALL</h2>
    <span class="logo-tag">Premium</span>
  </div>

  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#shop">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="header-right">
    <input class="search-input" id="topSearchInput" type="text" placeholder="Search products...">
    <button class="search-icon" aria-label="Open search">🔍</button>

    <button class="cart cart-btn" aria-label="Open cart">
      🛒 <span class="cart-count">0</span>
    </button>
  </div>
</header>

<!-- MOBILE SLIDE MENU -->
<nav class="mobile-menu" aria-label="Mobile menu">
  <div class="mobile-menu-header">
    <h3>RR MALL</h3>
    <button class="close-menu" aria-label="Close menu">✖</button>
  </div>
  <a href="#">Home</a>
  <a href="#shop">Products</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>
<div class="menu-overlay" aria-hidden="true"></div>

<!-- SEARCH POPUP -->
<div class="search-popup" role="dialog" aria-label="Search">
  <input id="popupSearchInput" type="text" placeholder="Search products...">
  <button class="close-search" aria-label="Close search">✖</button>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-bg"></div>

  <div class="hero-content">
    <div class="hero-badge">✨ Free delivery above ₹499 • Easy returns</div>
    <h1>Discover Premium Picks at <span>RR MALL</span></h1>
    <p class="typing" aria-label="Tagline"></p>

    <div class="hero-search">
      <input id="heroSearchInput" type="text" placeholder="Search (e.g. jacket, shoes)..." />
      <button id="heroSearchBtn" aria-label="Search">Search</button>
    </div>

    <div class="hero-buttons">
      <a href="#shop" class="cta-primary">Shop Now</a>
      <a href="#shop" class="cta-secondary">Trending</a>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<section id="shop" class="product-section">
  <h2 class="section-title">Trending Products</h2>

  <div id="productStatus" class="product-status" role="status" aria-live="polite"></div>
  <div id="skeletonGrid" class="product-grid skeleton-grid" aria-hidden="true"></div>
  <div id="productGrid" class="product-grid"></div>
</section>

<!-- MOBILE CART BAR -->
<div class="mobile-cart-bar">
  <span>🛒 Items: <b id="mobileCartCount">0</b></span>
  <button class="cart-btn">View Cart</button>
</div>

<!-- CART DRAWER -->
<aside class="cart-drawer" aria-label="Cart drawer" aria-hidden="true">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" aria-label="Close cart">✖</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">
    <div class="cart-summary">
      <div class="row">
        <span>Subtotal</span>
        <b id="cartSubtotal">₹ 0</b>
      </div>
      <div class="row small">
        <span>Delivery</span>
        <span id="cartDelivery">₹ 0</span>
      </div>
      <div class="row total">
        <span>Total</span>
        <b id="cartTotal">₹ 0</b>
      </div>
    </div>

    <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    <button id="clearCartBtn" class="clear-btn">Clear Cart</button>
  </div>
</aside>
<div class="cart-overlay" aria-hidden="true"></div>

<!-- QUICK VIEW MODAL -->
<div id="qvOverlay" class="qv-overlay" aria-hidden="true"></div>
<div id="qvModal" class="qv-modal" role="dialog" aria-label="Quick view" aria-hidden="true">
  <button id="qvClose" class="qv-close" aria-label="Close">✖</button>

  <div class="qv-content">
    <div class="qv-left">
      <img id="qvImg" alt="Product image">
    </div>

    <div class="qv-right">
      <div class="qv-top">
        <span id="qvCat" class="qv-cat"></span>
        <span id="qvRating" class="qv-rating"></span>
      </div>

      <h3 id="qvTitle" class="qv-title"></h3>

      <div class="qv-price">
        <span id="qvPrice" class="qv-new"></span>
        <span id="qvOld" class="qv-old"></span>
      </div>

      <p id="qvDesc" class="qv-desc"></p>

      <div class="qv-actions">
        <button id="qvAdd" class="qv-add">Add to Cart</button>
        <a id="qvGo" class="qv-go" href="#">View Details</a>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" aria-live="polite"></div>

<script src="scripts/app.js"></script>
</body>
</html>
