<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RR VADAPAV</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>

<header class="main-header">

  <!-- LEFT -->
  <div class="left">
    <div class="hamburger">
      <span class="icon">☰</span>
    </div>
  </div>

  <!-- LOGO -->
  <div class="logo">
    <img src="images.webp" alt="Logo"/>
    <h2>RR VADAPAV</h2>
  </div>

  <!-- DESKTOP NAV -->
  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <!-- RIGHT -->
  <div class="header-right">
    <input class="search-input" type="text" placeholder="Search products">
    <div class="search-icon">🔍</div>
    <div class="cart">
      🛒
      <span class="cart-count">0</span>
    </div>
  </div>

</header>

<!-- MOBILE MENU -->
<nav class="mobile-menu">
  <a href="#">Home</a>
  <a href="#">Products</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

<!-- SEARCH POPUP -->
<div class="search-popup">
  <input type="text" placeholder="Search products...">
  <button class="close-search">✖</button>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Biggest Sale of the Year!</h1>
    <p>Up to 50% off on all items. Grab your favorites today!</p>
    <a href="#shop" class="cta-button">Shop Now</a>
  </div>
</section>

<!-- DEMO BUTTON -->
<button class="add-cart-btn">Add to Cart (Demo)</button>

<script src="scripts/app.js"></script>
</body>
</html>
