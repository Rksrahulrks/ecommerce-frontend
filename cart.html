<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RR MALL • Cart</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>

<header class="main-header">
  <div class="left">
    <button class="hamburger" aria-label="Open menu">☰</button>
  </div>

  <div class="logo">
    <h2>RR MALL</h2>
    <span class="logo-tag">Premium</span>
  </div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#shop">Products</a>

    <a id="navLoginLink" href="auth.html">Login</a>
    <span id="navUserChip" class="user-chip" style="display:none;"></span>
    <button id="navLogoutBtn" class="logout-btn" type="button" style="display:none;">Logout</button>

    <a class="active-link" href="cart.html">Cart</a>
  </nav>

  <div class="header-right">
    <a class="back-link" href="index.html#shop">← Continue Shopping</a>
    <button class="cart" type="button" aria-label="Cart">
      🛒 <span class="cart-count">0</span>
    </button>
  </div>
</header>

<nav class="mobile-menu" aria-label="Mobile menu">
  <div class="mobile-menu-header">
    <h3>RR MALL</h3>
    <button class="close-menu" type="button" aria-label="Close menu">✖</button>
  </div>

  <a href="index.html">Home</a>
  <a href="index.html#shop">Products</a>
  <a class="active-link" href="cart.html">Cart</a>

  <a id="mobLoginLink" href="auth.html">Login</a>
  <span id="mobUserChip" class="user-chip" style="display:none; margin:10px 18px 0;"></span>
  <button id="mobLogoutBtn" class="logout-btn" type="button" style="display:none; margin:10px 18px 0 18px;">Logout</button>
</nav>
<div class="menu-overlay" aria-hidden="true"></div>

<main class="cart-page">
  <div class="cart-shell">
    <div class="cart-left">
      <h1 class="cart-title">Your Cart</h1>

      <div id="cpEmpty" class="cp-empty" hidden>
        <div class="cp-empty-card">
          <h3>Your cart is empty 🛒</h3>
          <p>Go back and add some premium products.</p>
          <a class="cta-primary cta-inline" href="index.html#shop">Shop Now</a>
        </div>
      </div>

      <div id="cpList" class="cp-list"></div>
    </div>

    <aside class="cart-right">
      <div class="sum-card">
        <h3>Order Summary</h3>

        <div class="sum-row">
          <span>Items</span>
          <b><span id="cpItemsCount">0</span></b>
        </div>

        <div class="sum-row">
          <span>Subtotal</span>
          <b id="cpSubtotal">₹ 0</b>
        </div>

        <div class="sum-row small">
          <span>Delivery</span>
          <b id="cpDelivery">₹ 0</b>
        </div>

        <div class="coupon">
          <label>Coupon</label>
          <div class="coupon-row">
            <input id="cpCoupon" type="text" placeholder="Try RR10 or RR50">
            <button id="cpApplyCoupon" type="button">Apply</button>
          </div>
          <div id="cpCouponNote" class="coupon-note"></div>
        </div>

        <div class="sum-row total">
          <span>Total</span>
          <b id="cpTotal">₹ 0</b>
        </div>

        <button id="cpCheckoutBtn" class="checkout-btn" type="button">Proceed to Checkout</button>
        <button id="cpClearBtn" class="clear-btn" type="button">Clear Cart</button>

        <div class="sum-note">Free delivery above ₹499</div>
      </div>
    </aside>
  </div>
</main>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="scripts/cart.js"></script>
<script type="module" src="scripts/auth-ui.js"></script>
</body>
</html>
